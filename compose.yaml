name: offer

# Local development stack. Every tool runs in a container; ports bind to 127.0.0.1 only.
# Secrets come from ./.env (copy .env.example); real env vars here override backend/.env.

x-laravel: &laravel
  build:
    context: .
    dockerfile: infra/docker/app.Dockerfile
    target: dev
  image: offer-app:dev
  working_dir: /app
  volumes:
    - ./backend:/app
    # vendor/ lives in a Docker volume: the Windows file share is far too slow for thousands of small files.
    # Copy it out for IDE autocompletion with: docker compose cp app:/app/vendor ./backend/
    - backend_vendor:/app/vendor
  environment:
    COMPOSER_PROCESS_TIMEOUT: 0
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB}
    DB_USERNAME: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    TYPESENSE_HOST: typesense
    TYPESENSE_PORT: 8108
    TYPESENSE_PROTOCOL: http
    TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    typesense:
      condition: service_healthy

services:
  app:
    <<: *laravel
    ports:
      - "127.0.0.1:8000:8000"

  horizon:
    <<: *laravel
    command: ["php", "artisan", "horizon"]
    profiles: ["workers"]

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    profiles: ["workers"]

  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:30.2
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY}", "--enable-cors"]
    volumes:
      - typesensedata:/data
    ports:
      - "127.0.0.1:8108:8108"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q ok <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: offer-web:dev
    working_dir: /repo/web
    command: ["sh", "-c", "pnpm install && pnpm dev --host 0.0.0.0 --port 4321"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./:/repo
      # node_modules stay inside Docker volumes: faster than the Windows file share, and pnpm symlinks work
      - node_modules_root:/repo/node_modules
      - node_modules_web:/repo/web/node_modules
      - node_modules_basket:/repo/packages/basket/node_modules
      - node_modules_types:/repo/packages/types/node_modules
      - pnpm_store:/root/.local/share/pnpm
    ports:
      - "127.0.0.1:4321:4321"
    profiles: ["web"]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  backend_vendor:
  pgdata:
  redisdata:
  typesensedata:
  node_modules_root:
  node_modules_web:
  node_modules_basket:
  node_modules_types:
  pnpm_store:
